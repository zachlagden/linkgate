[package]
name = "linkgate"
version = "0.1.0"
edition = "2021"
description = "Browser picker for links opened from WSL, with link anatomy and blocklist checks"
license = "MIT"
authors = ["Zach Lagden"]
repository = "https://github.com/zachlagden/linkgate"
readme = "../README.md"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
idna = "1"
psl = "2"
memmap2 = "0.9"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
arboard = { version = "3", default-features = false }
png = "0.17"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
