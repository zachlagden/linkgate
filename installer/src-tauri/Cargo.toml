[package]
name = "linkgate-setup"
version = "0.2.0"
edition = "2021"
description = "Installer for linkgate: downloads the latest release and sets up shortcuts, WSL and VS Code"
license = "MIT"
authors = ["Zach Lagden"]
repository = "https://github.com/zachlagden/linkgate"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
arboard = { version = "3", default-features = false }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
