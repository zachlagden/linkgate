name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build the release files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Check that every version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          cargo_version() { grep -m1 '^version' "$1" | sed -E 's/^version *= *"([^"]+)".*/\1/'; }
          json_version() { node -p "require('./$1').version"; }
          declare -A versions=(
            [package.json]=$(json_version package.json)
            [src-tauri/Cargo.toml]=$(cargo_version src-tauri/Cargo.toml)
            [src-tauri/tauri.conf.json]=$(json_version src-tauri/tauri.conf.json)
            [installer/package.json]=$(json_version installer/package.json)
            [installer/src-tauri/Cargo.toml]=$(cargo_version installer/src-tauri/Cargo.toml)
            [installer/src-tauri/tauri.conf.json]=$(json_version installer/src-tauri/tauri.conf.json)
          )
          expected=${versions[package.json]}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            expected=${GITHUB_REF_NAME#v}
          fi
          failed=0
          for file in "${!versions[@]}"; do
            if [[ ${versions[$file]} != "$expected" ]]; then
              echo "::error file=$file::$file has version ${versions[$file]}, expected $expected"
              failed=1
            fi
          done
          exit $failed

      - name: Build linkgate.exe
        run: pnpm tauri build --no-bundle

      - name: Build linkgate-setup.exe
        run: pnpm --filter linkgate-setup exec tauri build --no-bundle

      - name: Collect the files and print their SHA256 hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          cp src-tauri/target/release/linkgate.exe release-files/linkgate.exe
          cp installer/src-tauri/target/release/linkgate-setup.exe release-files/linkgate-setup.exe
          cd release-files
          sha256sum linkgate.exe linkgate-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release-files/*
          if-no-files-found: error

  publish:
    name: Attest and publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Take the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section headed '## [$version]' with content"
            exit 1
          fi
          cat notes.md

      - uses: actions/attest@v4
        with:
          subject-path: |
            release-files/linkgate.exe
            release-files/linkgate-setup.exe

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release-files/linkgate.exe release-files/linkgate-setup.exe
          --title "$GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag
